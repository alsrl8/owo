<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>OWO · 울음 스프라이트 미리보기</title>
  <style>
    :root{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#272333;background:#f8f4f9}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 16% 13%,#f5d6e7 0,transparent 32%),radial-gradient(circle at 85% 85%,#d9e7ff 0,transparent 36%),#f8f4f9}
    main{width:min(100%,580px);padding:24px;border:1px solid #ece5ef;border-radius:26px;background:#fff;box-shadow:0 18px 60px #33263b14}
    h1{margin:0 0 5px;font-size:24px;letter-spacing:-.05em}
    p{margin:0;color:#746b79;font-size:14px;line-height:1.5}
    .stage{margin:18px 0;border-radius:20px;background:radial-gradient(circle at 50% 76%,#fff 0,#faf5fb 42%,#f2edf6 100%);display:grid;place-items:center;overflow:hidden;aspect-ratio:1}
    canvas{display:block;width:min(100%,480px);height:auto;image-rendering:pixelated}
    .controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    button{border:0;border-radius:12px;background:#383049;color:#fff;padding:11px 17px;font:inherit;font-weight:700;cursor:pointer}
    button:focus-visible,input:focus-visible{outline:3px solid #aa83e9;outline-offset:3px}
    label{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:#53495e}
    input{accent-color:#7354a1;width:135px}
    output{min-width:33px;font-variant-numeric:tabular-nums}
    .frame{margin-left:auto;color:#8a7e92;font-size:13px;font-variant-numeric:tabular-nums}
    .note{margin-top:16px;font-size:12px;color:#8a7e92}
  </style>
</head>
<body>
  <main>
    <h1>쭈그려 앉아 울기</h1>
    <p>4컷을 차례로 재생한 OWO 도트 캐릭터 미리보기</p>
    <div class="stage"><canvas id="sprite" width="620" height="620" aria-label="쭈그려 앉아 우는 캐릭터 애니메이션" role="img"></canvas></div>
    <div class="controls">
      <button id="toggle" type="button" aria-pressed="true">일시정지</button>
      <label for="speed">속도 <input id="speed" type="range" min="2" max="10" value="5"><output id="fps" for="speed">5 FPS</output></label>
      <span class="frame" id="frame">1 / 4</span>
    </div>
    <p class="note">원본 2×2 이미지에서 투명 영역을 찾아 네 컷의 바닥과 중심을 맞춰 재생합니다.</p>
  </main>
  <script>
    const image = new Image();
    const canvas = document.querySelector('#sprite');
    const context = canvas.getContext('2d');
    const toggle = document.querySelector('#toggle');
    const speed = document.querySelector('#speed');
    const fps = document.querySelector('#fps');
    const frameLabel = document.querySelector('#frame');
    const frames = [];
    let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;
    let current = 0;
    let last = 0;

    function draw() {
      const frame = frames[current];
      context.clearRect(0, 0, canvas.width, canvas.height);
      if (!frame) return;
      context.imageSmoothingEnabled = false;
      const scale = Math.min(1, 540 / frame.height, 540 / frame.width);
      const width = frame.width * scale;
      const height = frame.height * scale;
      context.drawImage(image, frame.x, frame.y, frame.width, frame.height,
        (canvas.width - width) / 2, 590 - height, width, height);
      frameLabel.textContent = `${current + 1} / 4`;
    }

    function updateButton() {
      toggle.textContent = playing ? '일시정지' : '재생';
      toggle.setAttribute('aria-pressed', String(playing));
    }

    function tick(now) {
      if (playing && frames.length && now - last >= 1000 / Number(speed.value)) {
        current = (current + 1) % frames.length;
        draw();
        last = now;
      }
      requestAnimationFrame(tick);
    }

    image.onload = () => {
      const source = document.createElement('canvas');
      source.width = image.naturalWidth;
      source.height = image.naturalHeight;
      const sourceContext = source.getContext('2d', {willReadFrequently: true});
      sourceContext.drawImage(image, 0, 0);
      const pixels = sourceContext.getImageData(0, 0, source.width, source.height).data;
      const splitX = Math.floor(source.width / 2);
      const splitY = Math.floor(source.height / 2);
      for (let row = 0; row < 2; row++) {
        for (let col = 0; col < 2; col++) {
          const left = col ? splitX : 0;
          const right = col ? source.width : splitX;
          const top = row ? splitY : 0;
          const bottom = row ? source.height : splitY;
          let minX = right, minY = bottom, maxX = left - 1, maxY = top - 1;
          for (let y = top; y < bottom; y++) {
            for (let x = left; x < right; x++) {
              if (pixels[(y * source.width + x) * 4 + 3] < 32) continue;
              minX = Math.min(minX, x);
              minY = Math.min(minY, y);
              maxX = Math.max(maxX, x);
              maxY = Math.max(maxY, y);
            }
          }
          if (maxX >= minX && maxY >= minY) {
            frames.push({x: minX, y: minY, width: maxX - minX + 1, height: maxY - minY + 1});
          }
        }
      }
      draw();
      requestAnimationFrame(tick);
    };
    image.onerror = () => { document.querySelector('.note').textContent = '스프라이트 이미지를 불러오지 못했습니다.'; };
    image.src = './crying-sprite-sheet.png';
    toggle.addEventListener('click', () => { playing = !playing; last = performance.now(); updateButton(); });
    speed.addEventListener('input', () => { fps.value = `${speed.value} FPS`; });
    document.addEventListener('visibilitychange', () => { last = performance.now(); });
    updateButton();
  </script>
</body>
</html>
